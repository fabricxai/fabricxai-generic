<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Machine Nameplate SZ-757-D4</title>
<style>
  /* Test fixture — FabricXAI test kit. Suzuka Sewing Machine Co. is a fictitious brand.
     Print at 100% and photograph the plate for the machines-registry photo step. */
  body { font-family: Arial, sans-serif; background: #fff; color: #222; max-width: 700px; margin: 40px auto; padding: 0 24px; }
  p.note { font-size: 12px; color: #555; }
  @media print { p.note { display: none; } body { margin: 20mm auto; } }
</style>
</head>
<body>
  <p class="note">Print this page and photograph the plate below (it prints at roughly
  real size, 110 × 70 mm) — that photo is the input for the machines-registry reader.</p>

  <svg width="440" height="280" viewBox="0 0 440 280" role="img" aria-label="Machine nameplate">
    <defs>
      <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d9dcdf"/>
        <stop offset="0.5" stop-color="#c2c7cc"/>
        <stop offset="1" stop-color="#aab0b6"/>
      </linearGradient>
    </defs>
    <rect x="4" y="4" width="432" height="272" rx="14" fill="url(#metal)" stroke="#7c848b" stroke-width="2"/>
    <rect x="16" y="16" width="408" height="248" rx="8" fill="none" stroke="#5d646b" stroke-width="1.4"/>
    <circle cx="30" cy="30" r="7" fill="#8f979e" stroke="#5d646b"/>
    <circle cx="410" cy="30" r="7" fill="#8f979e" stroke="#5d646b"/>
    <circle cx="30" cy="250" r="7" fill="#8f979e" stroke="#5d646b"/>
    <circle cx="410" cy="250" r="7" fill="#8f979e" stroke="#5d646b"/>

    <text x="220" y="52" text-anchor="middle" font-family="Arial Black, Arial" font-size="20" letter-spacing="2" fill="#20262c">SUZUKA</text>
    <text x="220" y="70" text-anchor="middle" font-family="Arial" font-size="10.5" letter-spacing="1.5" fill="#343b42">SUZUKA SEWING MACHINE CO., LTD. · OSAKA, JAPAN</text>

    <line x1="40" y1="82" x2="400" y2="82" stroke="#5d646b" stroke-width="1"/>

    <g font-family="Arial" font-size="13" fill="#20262c">
      <text x="52" y="106">MODEL</text>       <text x="180" y="106" font-weight="bold" font-size="15">SZ-757-D4</text>
      <text x="52" y="130">TYPE</text>        <text x="180" y="130">4-THREAD OVERLOCK (SAFETY STITCH)</text>
      <text x="52" y="154">SERIAL NO.</text>  <text x="180" y="154" font-weight="bold" font-size="15">SZ24-118826</text>
      <text x="52" y="178">MAX SPEED</text>   <text x="180" y="178">7,000 S.P.M.</text>
      <text x="52" y="202">MOTOR</text>       <text x="180" y="202">550 W SERVO · 220 V · 3 PH · 50 Hz</text>
      <text x="52" y="226">MFG. DATE</text>   <text x="180" y="226">2024-11</text>
      <text x="52" y="250">LUBRICANT</text>   <text x="180" y="250">JIS K2213 W10 · MADE IN JAPAN</text>
    </g>
  </svg>
</body>
</html>
