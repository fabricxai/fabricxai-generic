name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Fast feedback: everything that needs no services ────────────────────────
  static:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Includes the two rules that are the ONLY enforcement behind CLAUDE.md rules 4
      # and 9 (no-float-money, analytics-no-writes). Their own tests run under `unit`.
      # --max-warnings=0: eslint-config-next ships warn-level rules (react-hooks
      # exhaustive-deps among them) which otherwise cannot fail a build, so the gate
      # silently weakens as warnings accumulate.
      - name: Lint
        run: pnpm lint --max-warnings=0

      - name: Typecheck
        run: pnpm typecheck

      # With coverage, and against a floor that only goes up (plan 7.3, audit TEST-M10).
      #
      # The floor is `coverage/floor.json`, committed. It is the UNIT project only —
      # services and pure logic — so it is far lower than how well the product is tested
      # and must not be read as the whole story; what it catches is a service gaining a
      # branch nothing exercises, on the day it happens.
      - name: Unit tests · coverage ratchet
        run: pnpm coverage

      # Nothing consumed a machine-readable result before, so a failing test was a line in
      # a log somebody had to scroll. `if: always()` because the run that FAILED is the one
      # whose report is worth having.
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-unit
          path: |
            reports/
            coverage/unit/
          retention-days: 14
          if-no-files-found: ignore

  # ── The frontend, which had no home at all until 7.2 ───────────────────────
  #
  # Both vitest projects were node-env and `.ts`-only, so no `.tsx` file in the repo was
  # reachable by any test and there was nothing for CI to run. There is now: the offline
  # queue that decides whether a floor's writes survive a dead access point, and the inbox
  # keyboard that decides which row a reviewer actually signs.
  #
  # Its own job rather than a step in `static`: jsdom needs no services but does need a
  # different environment, and keeping them apart means the 934 node tests stay fast.
  browser:
    name: jsdom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Component and DOM tests
        run: pnpm test:browser

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-browser
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  # ── Schema and migrations ──────────────────────────────────────────────────
  migrations:
    name: migrate-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fabricxai
          POSTGRES_PASSWORD: fabricxai
          POSTGRES_DB: fabricxai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fabricxai" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DIRECT_DATABASE_URL: postgres://fabricxai:fabricxai@localhost:5432/fabricxai
      DATABASE_URL: postgres://fabricxai_app_rw:ci-secret@localhost:5432/fabricxai
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migration chain is consistent
        run: pnpm exec drizzle-kit check

      # The check that catches real mistakes: someone edited schema.ts and forgot to
      # generate the migration. With no drift, generate writes nothing.
      - name: No schema drift
        run: |
          before=$(ls src/db/migrations/*.sql | wc -l)
          pnpm exec drizzle-kit generate
          after=$(ls src/db/migrations/*.sql | wc -l)
          if [ "$before" != "$after" ]; then
            echo "::error::schema.ts changed without a generated migration:"
            git status --porcelain src/db/migrations
            exit 1
          fi
          # Scoped to *.sql: meta/_journal.json changes whenever a migration is
          # legitimately added, so flagging it would mark normal work as tampering.
          git diff --exit-code -- 'src/db/migrations/*.sql'

      # Proves a fresh production database can be provisioned from zero — which is why
      # extensions live in 0000_extensions.sql and not only in the compose init hook.
      - name: Apply every migration to an empty database
        run: pnpm db:migrate

      - name: Application role exists and cannot bypass RLS
        run: pnpm db:setup-roles

  # ── The privilege model production actually runs (audit DB-B1) ─────────────
  #
  # Every table carries FORCE ROW LEVEL SECURITY, which binds the table OWNER too, and
  # every policy targets only `fabricxai_app`. Twelve SECURITY DEFINER helpers run as the
  # owner and read those forced tables. So the design depends on the owner bypassing RLS —
  # and if it does not, NOTHING ERRORS: the helpers return zero rows, which surfaces as
  # "nobody can log in", "events stop being delivered" and "the scheduler never ran".
  #
  # Every other job here runs as the initdb superuser, where that question cannot be asked.
  # This one provisions the hardened owner a real deployment uses and asks it.
  owner-privileges:
    name: non-superuser owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DIRECT_DATABASE_URL: postgres://fabricxai_owner:owner-secret@localhost:5432/fabricxai
      DATABASE_URL: postgres://fabricxai_app_rw:app-secret@localhost:5432/fabricxai
      APP_DB_PASSWORD: app-secret
      # Set so `setup-db-roles.mjs` runs its pooler probe instead of skipping it. Without
      # this the job printed "PGBOUNCER_AUTH_PASSWORD unset — skipping" and the pooler's
      # grants went unexercised by CI entirely, which is how a missing
      # `USAGE ON SCHEMA app` reached a real host and stopped the whole stack booting
      # (migration 0080). The probe connects AS pgbouncer_auth, so it fails here if either
      # grant is missing.
      PGBOUNCER_AUTH_PASSWORD: pooler-secret
      # `pnpm seed` loads lib/env.ts, which validates the WHOLE environment before it opens
      # a connection — so the job died with "Invalid environment (7 problems)" after the
      # roles it exists to test had already been provisioned correctly. The seven below are
      # every field the schema requires and this job had not set.
      #
      # Placeholders on purpose: this job has no Redis and no MinIO, and needs neither. The
      # seed writes document ROWS and uploads no objects (see seed/core-slice.ts), and
      # nothing here enqueues a job. These exist to satisfy validation, not to be dialled.
      APP_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: unused-in-this-job
      S3_SECRET_ACCESS_KEY: unused-in-this-job
      S3_BUCKET: unused-in-this-job
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The one-time superuser work a hardened deployment still needs. Discovered by
      # writing this job: none of it was documented, and `0000_extensions.sql` claimed a
      # fresh production database was "fully provisioned by pnpm db:migrate alone".
      #
      #  · extensions — `vector` is not a trusted extension, so a non-superuser cannot
      #    CREATE it. `IF NOT EXISTS` then makes migration 0000 a no-op rather than a
      #    permission error.
      #  · CREATEROLE — the owner provisions the app and pooler roles in 0070 and
      #    scripts/setup-db-roles.mjs.
      #  · pg_shadow — app.pgbouncer_get_auth is SECURITY DEFINER and reads verifiers, so
      #    it runs with the OWNER's rights. BYPASSRLS does not cover this: without the
      #    grant the pooler's auth_query fails and every client is refused.
      - name: Provision the owner a hardened deployment would use
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE fabricxai_owner LOGIN PASSWORD 'owner-secret'
            NOSUPERUSER BYPASSRLS CREATEROLE;
          CREATE DATABASE fabricxai OWNER fabricxai_owner;
          SQL
          psql -h localhost -U postgres -d fabricxai -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS btree_gin;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          GRANT SELECT ON pg_shadow TO fabricxai_owner;
          SQL

      - name: Confirm the owner really is not a superuser
        env:
          PGPASSWORD: postgres
        run: |
          # Guards the guard: if this ever becomes a superuser, every check below passes
          # for the wrong reason and DB-B1 goes back to being invisible.
          actual=$(psql -h localhost -U postgres -d postgres -tAc \
            "SELECT rolsuper::text FROM pg_roles WHERE rolname = 'fabricxai_owner'")
          if [ "$actual" != "false" ]; then
            echo "::error::fabricxai_owner is a superuser — this job proves nothing"
            exit 1
          fi

      - name: Migrate, provision roles and seed as that owner
        run: |
          pnpm db:migrate
          pnpm db:setup-roles
          pnpm seed --scale=pilot

      # The assertion: every SECURITY DEFINER helper still answers. Verified locally to
      # exit 1 when BYPASSRLS is removed (the owner cannot even read `roles`, i.e. login
      # is broken) and to refuse to run at all against a superuser.
      - name: Every SECURITY DEFINER helper still works
        run: node scripts/verify-owner-privileges.mjs

  # ── Services against real infrastructure ───────────────────────────────────
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fabricxai
          POSTGRES_PASSWORD: fabricxai
          POSTGRES_DB: fabricxai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fabricxai" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
      # MinIO is NOT a service container: it needs `server /data` as its command, and
      # GitHub service containers cannot override one. It is started as a step below.
      mailpit:
        image: axllent/mailpit:v1.21
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: '1'
          MP_SMTP_AUTH_ALLOW_INSECURE: '1'
        ports: ['1025:1025', '8025:8025']
    env:
      # NOTE: no PgBouncer in CI — the pooler is exercised locally and in prod. What CI
      # must prove is that RLS binds the non-owner role, and that holds either way.
      DATABASE_URL: postgres://fabricxai_app_rw:ci-secret@localhost:5432/fabricxai
      DIRECT_DATABASE_URL: postgres://fabricxai:fabricxai@localhost:5432/fabricxai
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3100
      BETTER_AUTH_URL: http://localhost:3100
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: fabricxai
      S3_SECRET_ACCESS_KEY: fabricxai-dev-secret
      S3_BUCKET: fabricxai-documents
      S3_FORCE_PATH_STYLE: 'true'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAILPIT_URL: http://localhost:8025
      MARBIM_MOCK: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start MinIO and create the private bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=fabricxai \
            -e MINIO_ROOT_PASSWORD=fabricxai-dev-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data

          for i in $(seq 1 40); do
            curl -sf http://localhost:9000/minio/health/live >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live >/dev/null \
            || { echo "::error::MinIO did not become ready"; docker logs minio; exit 1; }

          # `minio/mc` has `mc` as its entrypoint, so a shell has to be asked for
          # explicitly. No public buckets, ever (dev-plan §6).
          docker run --rm --network host --entrypoint sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c "
            mc alias set local http://localhost:9000 fabricxai fabricxai-dev-secret &&
            mc mb --ignore-existing local/fabricxai-documents &&
            mc anonymous set none local/fabricxai-documents"

      - name: Migrate and create the application role
        run: |
          pnpm db:migrate
          pnpm db:setup-roles

      # Gate A (auth), gate B (pending flow) and the core services. The suite starts its
      # own `next dev` on an exclusive port, so nothing here needs to babysit a server.
      - name: Integration tests
        run: pnpm test:integration

      # The auth limiter, actually refusing something (audit INFRA-H7).
      #
      # It cannot be enabled for the suite above: signup is three per hour per IP and that
      # suite signs up nine owners from one address, so a global flag fails unrelated tests
      # with a 429. So this runs ONE file, alone, against a server started with the flag —
      # which is the only way the numbers in LIMITS get observed refusing anything.
      #
      # The grep is the point: vitest exits 0 when every test is skipped, and this file
      # skips itself without the flag. Without this the step would pass having asserted
      # nothing, which is the failure mode the whole job exists to avoid.
      - name: The auth limiter refuses a guessing loop
        env:
          RATE_LIMIT_ENFORCE: '1'
          INTEGRATION_PORT: '3101'
        run: |
          set -o pipefail
          pnpm vitest run --config vitest.integration.config.ts \
            src/modules/core/__tests__/auth-rate-limit.integration.test.ts 2>&1 | tee limiter.log
          grep -q '2 passed' limiter.log || {
            echo "::error::the enforcing rate-limit tests did not run — they skipped"
            exit 1
          }

      # Phase 0 exit criterion C.
      - name: Seed is re-runnable
        run: |
          pnpm seed --scale=pilot
          pnpm seed --scale=pilot

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-integration
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  # ── The golden path and WCAG, on the screens used in gloves ────────────────
  #
  # Plan 7.2. One journey — sign in, reach the floor, see the approve inbox — plus axe-core
  # on the five floor screens at two viewports. Deliberately narrow: a broad Playwright
  # suite over a product still gaining screens is a maintenance bill paid in flaky reruns.
  #
  # It needs the same services as `integration` because it drives the real product, and a
  # production build because `next dev` is a different one — 7.1 measured the same page at
  # 2,887ms in dev and 296ms built, which is enough to turn a timeout into a pass.
  e2e:
    name: e2e · a11y
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fabricxai
          POSTGRES_PASSWORD: fabricxai
          POSTGRES_DB: fabricxai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fabricxai" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://fabricxai_app_rw:ci-secret@localhost:5432/fabricxai
      DIRECT_DATABASE_URL: postgres://fabricxai:fabricxai@localhost:5432/fabricxai
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: fabricxai
      S3_SECRET_ACCESS_KEY: fabricxai-dev-secret
      S3_BUCKET: fabricxai-documents
      S3_FORCE_PATH_STYLE: 'true'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      # The suite runs against a PRODUCTION build, and `env.ts` refuses the mock there —
      # 6.4's boot assertion, doing exactly what it was written for.
      MARBIM_MOCK: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start MinIO and create the private bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=fabricxai \
            -e MINIO_ROOT_PASSWORD=fabricxai-dev-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data

          for i in $(seq 1 40); do
            curl -sf http://localhost:9000/minio/health/live >/dev/null && break
            sleep 2
          done
          docker run --rm --network host --entrypoint sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c "
            mc alias set local http://localhost:9000 fabricxai fabricxai-dev-secret &&
            mc mb --ignore-existing local/fabricxai-documents &&
            mc anonymous set none local/fabricxai-documents"

      - name: Migrate, create the application role, seed the people the suite signs in as
        run: |
          pnpm db:migrate
          pnpm db:setup-roles
          pnpm seed --scale=pilot

      # Chromium only. The tablet project is the same engine at a 768px viewport, because
      # what 4.4 changed is a CSS breakpoint — the viewport is the variable, not the engine.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `playwright.config.ts` builds and starts the server itself.
      - name: Golden path and axe-core
        run: pnpm test:e2e

      - name: Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-e2e
          path: |
            e2e-results.xml
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ── Image builds ───────────────────────────────────────────────────────────
  # ── Supply chain ───────────────────────────────────────────────────────────
  #
  # An ERP holding payroll and LC data, deployed to a VPS a factory's own IT keeps
  # running. Neither of these existed before, so a known-vulnerable transitive
  # dependency or a committed key would have shipped unremarked.
  supply-chain:
    name: audit · secrets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree — a secret that
          # was committed and then removed is still a leaked secret.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Production dependencies only. A dev-only advisory is worth knowing about and is
      # not worth blocking a deploy on: it never reaches the factory's runtime.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker build · scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fabricxai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is what actually runs in the factory, so it is what gets scanned —
      # `pnpm audit` cannot see the Debian base layer, and the base is where an
      # unpatched OpenSSL would live.
      # Pinned to a tag that EXISTS. `0.28.0` never resolved — the action publishes `v`-
      # prefixed tags — so this step failed to start on every run and the scan it looks
      # like the repo performs was never performed.
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fabricxai:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Prove the image can actually start and answer, not merely that it compiled.
      #
      # No env supplied at all: lib/env.ts must reject it and name every problem. An image
      # that starts happily with no configuration is one that will start happily with the
      # WRONG configuration.
      #
      # Both commands docker-compose.prod.yml runs are checked, because they fail
      # differently and only one of them can be asserted on an exit code.
      - name: Refuse to boot without a valid environment
        run: |
          set -uo pipefail

          # The worker exits, so assert on its status — the strongest form available.
          if docker run --rm fabricxai:ci tsx src/worker/index.ts > /tmp/worker.log 2>&1; then
            echo '::error::the worker started with no environment — env validation is not running'
            exit 1
          fi
          if ! grep -q 'Invalid environment' /tmp/worker.log; then
            echo '::error::the worker failed for some reason OTHER than env validation'
            cat /tmp/worker.log
            exit 1
          fi

          # `next start` does NOT exit. When the instrumentation hook throws it logs
          # "Failed to prepare server" and lingers with a process that serves nothing, so
          # `if docker run …` waited forever and took the whole job to its 25-minute
          # ceiling. That went unnoticed because this step had never run: the Trivy scan
          # above it failed on every single build since this job was written, first on an
          # action tag that did not resolve and then on real findings. Assert on the log,
          # with a deadline.
          # `|| true` because the deadline expiring is the EXPECTED outcome — the process
          # never exits on its own, so `timeout` returns 124. GitHub runs this block with
          # `bash -e`, which a `set` line here cannot undo, so without this the step aborts
          # on 124 before reaching the assertion below.
          timeout 90 docker run --rm fabricxai:ci next start > /tmp/boot.log 2>&1 || true
          if ! grep -q 'Invalid environment' /tmp/boot.log; then
            echo '::error::the app served with no environment — env validation is not running'
            cat /tmp/boot.log
            exit 1
          fi

  # ── Publish ────────────────────────────────────────────────────────────────
  #
  # The `docker` job above builds the image, scans it and throws it away, which meant
  # `IMAGE` in docker-compose.prod.yml had nothing to point at and the deploy runbook's
  # §4/§5 could not run as written. This job is what closes that.
  #
  # It deliberately does NOT reuse the docker job's build to push from. Trivy and the
  # boot check are gates, and a gate you can push past is decoration — so publishing is a
  # separate job that `needs:` every quality job in this file. An image only reaches the
  # registry if lint, types, unit, browser, migrations, owner-privileges, integration,
  # e2e, supply-chain AND the scan all passed for that commit.
  #
  # The rebuild is nearly free: the docker job wrote `cache-to: type=gha,mode=max`, so
  # this is a layer-cache hit rather than a second full Next.js build.
  publish:
    name: publish image · ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # main only. A PR image would be an untested artefact in a registry that a tired
    # operator could pull at 2am.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - static
      - browser
      - migrations
      - owner-privileges
      - integration
      - e2e
      - supply-chain
      - docker
    permissions:
      contents: read
      # This is what lets GITHUB_TOKEN push to GHCR. No PAT is involved: a personal token
      # with write:packages would be a long-lived credential for a once-per-merge job.
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by commit SHA, never `:latest`. The tag is for humans reading the registry;
      # what gets deployed is the digest below, because a tag can be moved and a digest
      # cannot.
      #
      # `:main` is the one deliberate exception: a moving tag the VPS auto-deploy timer
      # (ops/vps-platform/autodeploy.sh) polls to learn that a newer green build exists.
      # It is a POINTER, not what runs — the poller resolves it to a digest and pins
      # .env.production to that digest, so "which build is running" stays answerable.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The deploy runbook says to pin by digest: "during an incident 'which build is
      # running' is the question you least want to be unable to answer." Printing it in
      # the job summary means nobody has to go digging in the registry UI to find the one
      # line they need to paste into .env.production.
      - name: Report the line to paste into .env.production
        run: |
          {
            echo '### Deployable image'
            echo
            echo 'Paste into `.env.production` on the VPS, then `docker compose … up -d`:'
            echo
            echo '```'
            echo "IMAGE=ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
