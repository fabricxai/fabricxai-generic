# pgBackRest — offsite backups for the single-factory deployment.
#
# The dev plan calls this "non-negotiable before first real factory data" and sets
# RTO ≤ 4h / RPO ≤ 15min (architecture §9). Those two numbers shaped every line here:
#
#   RPO 15min → WAL is archived CONTINUOUSLY, and `archive_timeout` in the compose file
#               forces a segment switch every 5 minutes so a quiet afternoon cannot
#               stretch the recovery point past the promise. A nightly dump alone means
#               losing a day of GRNs, cut reports and hourly output — a day nobody can
#               reconstruct, because the paper it came from has moved on.
#   RTO 4h    → the repository is S3-compatible and OFFSITE, so a restore never depends
#               on the failed host, and `--delta` restores only what changed.
#
# ── Secrets are NOT in this file ──────────────────────────────────────────────────
#
# This file is committed. pgBackRest does NOT expand `${VAR}` in its config — it takes
# the literal characters, which is how an earlier version of this file ended up
# configured with a bucket named `${PGBACKREST_BUCKET}`. Every credential therefore
# arrives as an environment variable instead, which pgBackRest reads natively: any
# option `foo-bar` can be set as `PGBACKREST_FOO_BAR`. See `.env.backup.example`.
#
# ── The repository must be somewhere else ─────────────────────────────────────────
#
# Not this host's disk, and not the MinIO this deployment runs. A backup on the box you
# are recovering from is not a backup. Cloudflare R2, Backblaze B2, or any S3 host in
# another failure domain.

[global]
repo1-type=s3
repo1-path=/fabricxai

# R2 and MinIO both need path-style addressing; virtual-host style is an AWS-ism that
# these endpoints answer with a DNS failure rather than a useful error.
repo1-s3-uri-style=path

# Encrypted client-side with a passphrase the storage provider never sees. LOSING THIS
# PASSPHRASE LOSES THE BACKUPS — there is no recovery, no support ticket, no vendor-side
# copy. It belongs wherever the factory's other unrecoverable secrets live, and a second
# copy belongs somewhere that survives the factory.
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass       → PGBACKREST_REPO1_CIPHER_PASS
# repo1-s3-bucket         → PGBACKREST_REPO1_S3_BUCKET
# repo1-s3-endpoint       → PGBACKREST_REPO1_S3_ENDPOINT
# repo1-s3-region         → PGBACKREST_REPO1_S3_REGION
# repo1-s3-key            → PGBACKREST_REPO1_S3_KEY
# repo1-s3-key-secret     → PGBACKREST_REPO1_S3_KEY_SECRET

# ── Retention ─────────────────────────────────────────────────────────────────────
#
# The schedule is weekly full + daily differential (scripts/backup.sh picks which).
# DIFFERENTIAL rather than incremental, deliberately: a restore from a differential
# reads exactly two backups — the full and one diff — where a chain of six incrementals
# reads seven, and every one of them is a serial dependency inside the 4h RTO. The diffs
# cost more storage on Saturday than incrementals would. Storage is cheap; the sixth
# hour of an outage is not.
#
# 4 fulls ≈ one month of history — long enough that corruption discovered on a Monday
# can be escaped to a point before it started.
repo1-retention-full=4
repo1-retention-full-type=count
repo1-retention-diff=7

# WAL retention follows the FULL backups, not the diffs. This is the expensive choice
# and it is made on purpose: `retention-archive-type=diff` would let pgBackRest expire
# the WAL between full backups, which quietly removes the ability to recover to an
# arbitrary Tuesday afternoon while leaving `info` looking healthy. Point-in-time
# recovery across the whole retention window is the entire reason for §4 of the restore
# runbook, so the WAL that makes it possible is kept for all four fulls.
repo1-retention-archive-type=full
repo1-retention-archive=4

# ── Transfer ──────────────────────────────────────────────────────────────────────
#
# Compression on the client, so what crosses the factory's uplink is small. Bangladeshi
# factory internet is the constraint here, not CPU.
compress-type=zst
compress-level=6

# Two processes: enough to saturate a modest uplink, not enough to compete with the ERP
# for CPU the floor is waiting on.
process-max=2

# Bundle small files into larger objects. This database has thousands of small relation
# files; without bundling each is a separate PUT, and per-request cost and latency
# dominate the backup on an object store.
repo1-bundle=y

# Start the backup immediately rather than waiting for the next natural checkpoint —
# otherwise a nightly backup can sit idle for minutes before it does anything.
start-fast=y

# ── WAL archiving ─────────────────────────────────────────────────────────────────
#
# Asynchronous: `archive_command` hands the segment to a spool directory and returns, and
# a background process ships batches. Synchronous archiving over a factory uplink makes
# every WAL switch wait on the internet, which shows up as write latency on the floor.
archive-async=y
spool-path=/var/spool/pgbackrest

# ⚠ THE ESCAPE VALVE, AND WHAT IT COSTS.
#
# If the repository is unreachable, spooled WAL accumulates on the local disk. Without a
# limit it fills the disk and Postgres stops — the factory stops, but nothing is lost.
# With this limit, pgBackRest DROPS the oldest spooled segments once the queue passes
# 8GiB and reports success to Postgres, so the database keeps running and THE PITR CHAIN
# IS BROKEN AT THAT POINT.
#
# That is a deliberate trade for a factory that cannot stop, and it is only defensible
# because the break is detected rather than silent:
#   · scripts/restore-verify.sh checks archive continuity weekly and alerts on a gap
#   · crossing this threshold means TAKE A FULL BACKUP IMMEDIATELY — the chain from the
#     last full no longer reaches the present, and no `info` output will say so in words
#
# 8GiB is roughly 8 hours of headroom at this deployment's peak WAL rate on a 200GB disk
# that also holds the database. Raise it if the disk is bigger; never remove the alert.
archive-push-queue-max=8GiB

log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[global:archive-push]
# WAL segments are small and numerous — more parallelism here than for a backup.
process-max=2

[global:archive-get]
# Restore replays WAL through this path; it is squarely inside the RTO.
process-max=4

[fabricxai]
pg1-path=/var/lib/postgresql/data
pg1-port=5432

# pgBackRest talks to Postgres over the UNIX SOCKET, not TCP — libpq is how it runs
# pg_backup_start/stop, and pgBackRest has no TCP host option for that connection (its
# `pg1-host` means "a remote pgBackRest process", which is a different topology). The
# socket directory is a shared named volume between the postgres and backup containers;
# see docker-compose.prod.yml.
pg1-socket-path=/var/run/postgresql

# pg1-user / pg1-database come from the environment so they track POSTGRES_USER and
# POSTGRES_DB in .env.production rather than being a second place to change them:
#   PGBACKREST_PG1_USER · PGBACKREST_PG1_DATABASE
